[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proscenium"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "jsonschema[format]>=4.23,<5",
    "rfc8785>=0.1.4,<1",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
]
