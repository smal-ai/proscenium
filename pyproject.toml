[project]
name = "proscenium-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["proscenium"]

[tool.uv.workspace]
members = ["apps/backend"]

[tool.uv.sources]
proscenium = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema", "types-PyYAML", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["apps/backend/src/proscenium/contracts/generated.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
exclude = ["docs/", ".venv/"]
