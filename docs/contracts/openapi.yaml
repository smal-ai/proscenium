openapi: 3.1.0
info:
  title: Proscenium application and tool protocol
  version: 1.0.0
  description: Normative host-native protocol. README.md describes compatible extensions, and ../owner-policy.md defines caller capabilities and execution identity.
servers:
  - url: /
security:
  - OwnerSession: []
x-owner-write-parameters: &ownerWrite
  - $ref: '#/components/parameters/IdempotencyKey'
  - $ref: '#/components/parameters/CsrfToken'
x-tool-write-parameters: &toolWrite
  - $ref: '#/components/parameters/IdempotencyKey'
paths:
  /api/v1/owner/session:
    post:
      operationId: pairOwnerSession
      security: []
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/OwnerBootstrap'}
      responses:
        '201':
          description: Paired owner session; also sets the private owner cookie.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/OwnerSession'}
        '200':
          description: Retry of the same successful pairing operation/client nonce.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/OwnerSession'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/configuration:
    get:
      operationId: getConfigurationView
      responses:
        '200':
          description: Non-secret configuration and known capability state. Does not start services.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ConfigurationView'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/configuration/status:
    get:
      operationId: getConfigurationStatus
      responses:
        '200':
          description: Bounded read-only provider and workstation bridge status. Does not start services or reserve budgets.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ConfigurationStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/configuration/profiles/{profile_id}:
    parameters:
      - {name: profile_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    put:
      operationId: upsertAuthoringProfile
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/AuthoringProfileUpsert'}
      responses:
        '200':
          description: Updated owner authoring profiles.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ConfigurationView'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/configuration/profiles/{profile_id}/delete:
    parameters:
      - {name: profile_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: deleteAuthoringProfile
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/AuthoringProfileDelete'}
      responses:
        '200':
          description: Updated owner authoring profiles.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ConfigurationView'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects:
    get:
      operationId: listProjects
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Saved project metadata, owner channel only.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ProjectPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: openProject
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ProjectOpen'}
      responses:
        '201': &projectResponse
          description: Created or registered project. No model work started.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ProjectRecord'}
        '200': *projectResponse
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/activate:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: activateProject
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/rebind:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: rebindProjectLocation
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ProjectRebind'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/snapshot:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: getProjectSnapshot
      responses:
        '200':
          description: Consistent read model with an event replay watermark.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ProjectSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/contexts:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: captureContext
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ContextSnapshot'}
      responses:
        '201': &contextResponse
          description: Immutable context. Findings become submitted instructions only when a message referencing this context is accepted.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ContextSnapshot'}
        '200': *contextResponse
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/contexts/{context_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: context_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getContext
      responses:
        '200': *contextResponse
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/requests:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listRequests
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Requests in stable accepted order.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/RequestPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: submitRequest
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/MessageSubmit'}
      responses:
        '202': {$ref: '#/components/responses/RequestReceipt'}
        '200': {$ref: '#/components/responses/RequestReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/requests/{request_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: request_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getRequest
      responses:
        '200': {$ref: '#/components/responses/RequestRecord'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/requests/{request_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: request_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: cancelHeldRequest
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/resume:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: resumeProjectWork
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ResumeCommand'}
      responses:
        '202': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/resumes/{operation_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: operation_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getResumeOperation
      responses:
        '200':
          description: Observed status of the original admitted Resume operation.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ResumeOperationStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/settings:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    put:
      operationId: updateProjectSettings
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ProjectSettings'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/items:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listItems
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: kind, in: query, schema: {type: string, enum: [asset, scene, storyboard, sequence, unity_result]}}
      responses:
        '200':
          description: Item catalogue.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ItemPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/items/{item_id}/versions:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: item_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listItemVersions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Immutable published versions in publication order.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/VersionPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/versions/{version_id}/relationships:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: version_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getVersionRelationships
      description: Owner-only read for the active project. Inverse rows keep their canonical orientation. On relationship_revision_changed, restart at page one.
      parameters:
        - {name: direction, in: query, schema: {type: string, enum: [uses, used_by], default: uses}}
        - name: latest_per_item
          in: query
          description: When direction is used_by, keep only the newest matching version per consuming item (preferring current). Ignored for uses.
          schema: {type: boolean, default: false}
        - {name: shot_id, in: query, description: Shot in the given storyboard version., schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: One hop of exact published relationship evidence, with coverage independent of page exhaustion.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/RelationshipPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/versions/{version_id}/shot-plan:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: version_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getVersionShotPlan
      responses:
        '200':
          description: Server-projected ShotPlan. source_commit and owner_selected are host-resolved. The authored file is AuthoredShotPlan.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ShotPlan'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/versions/{version_id}/sequence-map:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: version_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getVersionSequenceMap
      responses:
        '200':
          description: SequenceMap for a published sequence version.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/SequenceMap'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/versions/{version_id}/proxy-mapping:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: version_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getVersionProxyMapping
      parameters:
        - {name: mapping_artifact_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}}
      responses:
        '200':
          description: ProxyMapping for a published asset or scene version.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ProxyMapping'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listJobs
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Independent job status and availability.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getJob
      responses:
        '200':
          description: Job and its immutable admitted render specification where applicable.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/availability:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getFrameAvailability
      responses:
        '200':
          description: Ready and missing source-frame intervals, independently of job failure state.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/FrameAvailability'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/attempts:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listJobAttempts
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Attempt history, including original owner/provider identities and terminal evidence.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobAttemptPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/frames:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listFrameReceipts
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: from_frame, in: query, schema: {type: integer, minimum: 1}}
        - {name: to_frame, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Ready receipts ordered by source frame.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/FramePage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/segments:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listPreviewSegments
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Ready independently decodable segments in source interval order.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/SegmentPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: requestJobCancellation
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '202': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/uploads/{upload_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: upload_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    put:
      operationId: uploadImage
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201': {$ref: '#/components/responses/Artifact'}
        '200': {$ref: '#/components/responses/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/artifacts:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listRetainedArtifacts
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: kind, in: query, schema: {type: string, enum: [image, mask, proxy, proxy_map, video, frame_map, document, source_blob, log, audio]}}
        - {name: purpose, in: query, schema: {type: string, enum: [reference, concept, keyframe, draft_motion, final, inspection, metadata, mask, log]}}
      responses:
        '200':
          description: Registered retained artefacts with recorded attribution, including unpublished and legacy outputs.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/RetainedArtifactPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/artifacts/{artifact_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/ArtifactId'}
    get:
      operationId: getArtifact
      responses:
        '200': {$ref: '#/components/responses/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/artifacts/{artifact_id}/content:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/ArtifactId'}
      - {name: Range, in: header, schema: {type: string}}
    get:
      operationId: getArtifactContent
      responses:
        '200': {$ref: '#/components/responses/Media'}
        '206': {$ref: '#/components/responses/Media'}
        '416': {description: Invalid or unsatisfiable single byte range.}
        default: {$ref: '#/components/responses/Error'}
    head:
      operationId: headArtifactContent
      responses:
        '200': {$ref: '#/components/responses/MediaHead'}
        '206': {$ref: '#/components/responses/MediaHead'}
        '416': {description: Invalid or unsatisfiable single byte range.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/annotations:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listAnnotations
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: version_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}}
      responses:
        '200':
          description: Saved annotations with exact targets and revisions.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/AnnotationPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: saveAnnotation
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/AnnotationSave'}
      responses:
        '201': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/selections:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listSelections
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Owner choices per selection slot, including withdrawals.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/SelectionPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: saveSelection
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/SelectionSave'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listOwnerReviews
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: filter, in: query, schema: {type: string, enum: [pending, all]}}
      responses:
        '200':
          description: Review tickets for the project, ordered newest first.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ReviewPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: requestOwnerReview
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/ReviewRequest'}
      responses:
        '202': {$ref: '#/components/responses/ReviewTicket'}
        '200': {$ref: '#/components/responses/ReviewTicket'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews/{review_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getOwnerReview
      responses:
        '200':
          description: Review summary, original criteria, targets, findings and sanitised diagnostics.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ReviewDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews/{review_id}/resolve:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: resolveOwnerReview
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews/{review_id}/findings:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listOwnerReviewFindings
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Owner-visible findings. This route is not a native tool.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/FindingPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews/{review_id}/findings/{finding_id}/reject:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
      - {name: finding_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: rejectReviewFinding
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/decisions/{decision_id}/answer:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: decision_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: answerOwnerDecision
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/DecisionAnswer'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/events:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: replayProjectEvents
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Durable ordered event page.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/EventPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events:
    get:
      operationId: connectProjectEvents
      description: WebSocket upgrade using Subscription and SocketControl definitions in schema.json with ordered project event replay.
      responses:
        '101': {description: Authenticated WebSocket upgraded.}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/artifacts:
    post:
      operationId: registerToolArtifact
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ArtifactRegister'}
      responses:
        '201': {$ref: '#/components/responses/Artifact'}
        '200': {$ref: '#/components/responses/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/publications:
    post:
      operationId: publishOutputs
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/PublicationSubmit'}
      responses:
        '201': &publicationResponse
          description: Atomic registration of completed source versions and preview intents.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/PublicationReceipt'}
        '200': *publicationResponse
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/previews:
    post:
      operationId: requestPreview
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/PreviewRequest'}
      responses:
        '202':
          description: Presentation job accepted for an existing published version, without changing its head.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        '200':
          description: Existing identical preview intent/job.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/previews/order:
    post:
      operationId: setPreviewOrder
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/PreviewOrderUpdate'}
      responses:
        '200':
          description: Updated or replayed preview pass order for a published version.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/VersionRecord'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/generation-jobs:
    post:
      operationId: submitGenerationJob
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/GenerationSubmit'}
      responses:
        '202': &jobResponse
          description: Budget reservation and durable generation intent accepted.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        '200': *jobResponse
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/jobs:
    post:
      operationId: admitToolJob
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/JobAdmission'}
      responses:
        '202': *jobResponse
        '200': *jobResponse
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/jobs/{job_id}/retry:
    parameters:
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: retryToolJob
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/JobRetry'}
      responses:
        '202': *jobResponse
        '200': *jobResponse
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/jobs/{job_id}/state:
    parameters:
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: updateJobState
      security: [{ToolCapability: []}, {WorkerCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/JobStateUpdate'}
      responses:
        '200': *jobResponse
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/reviews:
    post:
      operationId: requestToolReview
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody: {$ref: '#/components/requestBodies/ReviewRequest'}
      responses:
        '202': {$ref: '#/components/responses/ReviewTicket'}
        '200': {$ref: '#/components/responses/ReviewTicket'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/reviews/{review_id}/complete:
    parameters:
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: completeToolReview
      security: [{ToolCapability: []}, {WorkerCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ReviewComplete'}
      responses:
        '200': {$ref: '#/components/responses/ReviewTicket'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/reviews/{review_id}/escalate:
    parameters:
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: escalateToolReview
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ReviewEscalate'}
      responses:
        '200': {$ref: '#/components/responses/ReviewTicket'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/frame-receipts:
    post:
      operationId: registerFrameReceipt
      security: [{WorkerCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/FrameReceipt'}
      responses:
        '201': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/segments:
    post:
      operationId: registerPreviewSegment
      security: [{WorkerCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/PreviewSegment'}
      responses:
        '201': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    OwnerSession: {type: apiKey, in: cookie, name: proscenium_owner}
    ToolCapability: {type: http, scheme: bearer, description: Work/project/operation-scoped native-tool authority; not an owner session.}
    WorkerCapability: {type: http, scheme: bearer, description: Exact admitted job and input-identity authority.}
  parameters:
    ProjectId: {name: project_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    ArtifactId: {name: artifact_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    CsrfToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 32}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
  requestBodies:
    RevisionCommand:
      required: true
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/RevisionCommand'}
    ReviewRequest:
      required: true
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/ReviewRequest'}
  responses:
    Error:
      description: Structured failure with bounded reason codes and operation attribution.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/Error'}
    CommandReceipt:
      description: Durable command receipt, not proof that an asynchronous operation completed.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/CommandReceipt'}
    RequestReceipt:
      description: Existing/accepted Queue, Steer or Stop identity and observed status.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/RequestReceipt'}
    RequestRecord:
      description: Immutable user submission, acceptance time, context reference and current receipt. Available before native dispatch.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/RequestRecord'}
    ReviewTicket:
      description: Review status only. Unapproved findings are not returned to a native tool.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/ReviewTicket'}
    Artifact:
      description: Registered artefact metadata, with actual hash/dimensions.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/Artifact'}
    Media:
      description: Immutable complete or ranged media bytes.
      headers:
        ETag: {schema: {type: string}}
        Accept-Ranges: {schema: {type: string, const: bytes}}
        Content-Length: {schema: {type: integer, minimum: 0}}
        Content-Range: {schema: {type: string}}
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    MediaHead:
      description: Same media/range headers as GET, without a response body.
      headers:
        ETag: {schema: {type: string}}
        Accept-Ranges: {schema: {type: string, const: bytes}}
        Content-Length: {schema: {type: integer, minimum: 0}}
        Content-Range: {schema: {type: string}}
