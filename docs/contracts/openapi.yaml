openapi: 3.1.0
info:
  title: Proscenium application and tool protocol
  version: 1.0.0
  description: Normative specification only. Implementation is planned. See http-api.md for semantic invariants and caller capabilities.
servers:
  - url: /
security:
  - OwnerSession: []
x-owner-write-parameters: &ownerWrite
  - $ref: '#/components/parameters/IdempotencyKey'
  - $ref: '#/components/parameters/CsrfToken'
x-tool-write-parameters: &toolWrite
  - $ref: '#/components/parameters/IdempotencyKey'
paths:
  /api/v1/owner/session:
    post:
      operationId: pairOwnerSession
      security: []
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/OwnerBootstrap'}
      responses:
        '201':
          description: Paired owner session; also sets the private owner cookie.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/OwnerSession'}
        '200':
          description: Retry of the same successful pairing operation/client nonce.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/OwnerSession'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/configuration:
    get:
      operationId: getConfigurationView
      responses:
        '200':
          description: Non-secret configuration and known capability state. Does not start services.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ConfigurationView'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects:
    get:
      operationId: listProjects
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Saved project metadata, owner channel only.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ProjectPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: openProject
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ProjectOpen'}
      responses:
        '201': &projectResponse
          description: Created or registered project. No model work started.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ProjectRecord'}
        '200': *projectResponse
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/activate:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: activateProject
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/rebind:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: rebindProjectLocation
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ProjectRebind'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/snapshot:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: getProjectSnapshot
      responses:
        '200':
          description: Consistent read model with an event replay watermark.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ProjectSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/contexts:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: captureContext
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ContextSnapshot'}
      responses:
        '201': &contextResponse
          description: Immutable context. Findings become submitted instructions only when a message referencing this context is accepted.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ContextSnapshot'}
        '200': *contextResponse
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/contexts/{context_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: context_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getContext
      responses:
        '200': *contextResponse
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/requests:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listRequests
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Requests in stable accepted order.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/RequestPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: submitRequest
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/MessageSubmit'}
      responses:
        '202': {$ref: '#/components/responses/RequestReceipt'}
        '200': {$ref: '#/components/responses/RequestReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/requests/{request_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: request_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getRequest
      responses:
        '200': {$ref: '#/components/responses/RequestReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/requests/{request_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: request_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: cancelHeldRequest
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/resume:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: resumeProjectWork
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ResumeCommand'}
      responses:
        '202': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/settings:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    put:
      operationId: updateProjectSettings
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ProjectSettings'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/items:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listItems
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: kind, in: query, schema: {enum: [asset, scene, storyboard, sequence, unity_result]}}
      responses:
        '200':
          description: Item catalogue.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/ItemPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/items/{item_id}/versions:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: item_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listItemVersions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Immutable published versions in publication order.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/VersionPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listJobs
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Independent job status and availability.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getJob
      responses:
        '200':
          description: Job and its immutable admitted render specification where applicable.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/availability:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: getFrameAvailability
      responses:
        '200':
          description: Ready and missing source-frame intervals, independently of job failure state.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/FrameAvailability'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/frames:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listFrameReceipts
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: from_frame, in: query, schema: {type: integer, minimum: 1}}
        - {name: to_frame, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Ready receipts ordered by source frame.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/FramePage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/segments:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listPreviewSegments
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Ready independently decodable segments in source interval order.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/SegmentPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/jobs/{job_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: job_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: requestJobCancellation
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '202': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/uploads/{upload_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: upload_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    put:
      operationId: uploadImage
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201': {$ref: '#/components/responses/Artifact'}
        '200': {$ref: '#/components/responses/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/artifacts/{artifact_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/ArtifactId'}
    get:
      operationId: getArtifact
      responses:
        '200': {$ref: '#/components/responses/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/artifacts/{artifact_id}/content:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/ArtifactId'}
      - {name: Range, in: header, schema: {type: string}}
    get:
      operationId: getArtifactContent
      responses:
        '200': {$ref: '#/components/responses/Media'}
        '206': {$ref: '#/components/responses/Media'}
        '416': {description: Invalid or unsatisfiable single byte range.}
        default: {$ref: '#/components/responses/Error'}
    head:
      operationId: headArtifactContent
      responses:
        '200': {$ref: '#/components/responses/MediaHead'}
        '206': {$ref: '#/components/responses/MediaHead'}
        '416': {description: Invalid or unsatisfiable single byte range.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/annotations:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listAnnotations
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: version_id, in: query, schema: {$ref: './schema.json#/$defs/Id'}}
      responses:
        '200':
          description: Saved annotations with exact targets and revisions.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/AnnotationPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: saveAnnotation
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/AnnotationSave'}
      responses:
        '201': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/selections:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listSelections
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Owner choices per selection slot, including withdrawals.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/SelectionPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: saveSelection
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/SelectionSave'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: requestOwnerReview
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/ReviewRequest'}
      responses:
        '202': {$ref: '#/components/responses/ReviewTicket'}
        '200': {$ref: '#/components/responses/ReviewTicket'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews/{review_id}/findings:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    get:
      operationId: listOwnerReviewFindings
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Owner-visible findings. This route is not a native tool.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/FindingPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/reviews/{review_id}/findings/{finding_id}/reject:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: review_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
      - {name: finding_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: rejectReviewFinding
      parameters: *ownerWrite
      requestBody: {$ref: '#/components/requestBodies/RevisionCommand'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/decisions/{decision_id}/answer:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: decision_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    post:
      operationId: answerOwnerDecision
      parameters: *ownerWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/DecisionAnswer'}
      responses:
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/events:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: replayProjectEvents
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Durable ordered event page.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/EventPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events:
    get:
      operationId: connectProjectEvents
      description: WebSocket upgrade. Subscription and SocketControl schemas and replay behaviour are defined in events.md.
      responses:
        '101': {description: Authenticated WebSocket upgraded.}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/artifacts:
    post:
      operationId: registerToolArtifact
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/ArtifactRegister'}
      responses:
        '201': {$ref: '#/components/responses/Artifact'}
        '200': {$ref: '#/components/responses/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/publications:
    post:
      operationId: publishOutputs
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/PublicationSubmit'}
      responses:
        '201': &publicationResponse
          description: Atomic registration of completed source versions and preview intents.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/PublicationReceipt'}
        '200': *publicationResponse
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/previews:
    post:
      operationId: requestPreview
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/PreviewRequest'}
      responses:
        '202':
          description: Presentation job accepted for an existing published version, without changing its head.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        '200':
          description: Existing identical preview intent/job.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/generation-jobs:
    post:
      operationId: submitGenerationJob
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/GenerationSubmit'}
      responses:
        '202': &jobResponse
          description: Budget reservation and durable generation intent accepted.
          content:
            application/json:
              schema: {$ref: './schema.json#/$defs/JobRecord'}
        '200': *jobResponse
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/reviews:
    post:
      operationId: requestToolReview
      security: [{ToolCapability: []}]
      parameters: *toolWrite
      requestBody: {$ref: '#/components/requestBodies/ReviewRequest'}
      responses:
        '202': {$ref: '#/components/responses/ReviewTicket'}
        '200': {$ref: '#/components/responses/ReviewTicket'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/frame-receipts:
    post:
      operationId: registerFrameReceipt
      security: [{WorkerCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/FrameReceipt'}
      responses:
        '201': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/segments:
    post:
      operationId: registerPreviewSegment
      security: [{WorkerCapability: []}]
      parameters: *toolWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schema.json#/$defs/PreviewSegment'}
      responses:
        '201': {$ref: '#/components/responses/CommandReceipt'}
        '200': {$ref: '#/components/responses/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    OwnerSession: {type: apiKey, in: cookie, name: proscenium_owner}
    ToolCapability: {type: http, scheme: bearer, description: Work/project/operation-scoped native-tool authority; not an owner session.}
    WorkerCapability: {type: http, scheme: bearer, description: Exact admitted job and input-identity authority.}
  parameters:
    ProjectId: {name: project_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    ArtifactId: {name: artifact_id, in: path, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {$ref: './schema.json#/$defs/Id'}}
    CsrfToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 32}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
  requestBodies:
    RevisionCommand:
      required: true
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/RevisionCommand'}
    ReviewRequest:
      required: true
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/ReviewRequest'}
  responses:
    Error:
      description: Structured failure. Specific status/error combinations are normative in http-api.md.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/Error'}
    CommandReceipt:
      description: Durable command receipt, not proof that an asynchronous operation completed.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/CommandReceipt'}
    RequestReceipt:
      description: Existing/accepted Queue, Steer or Stop identity and observed status.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/RequestReceipt'}
    ReviewTicket:
      description: Review status only. Unapproved findings are not returned to a native tool.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/ReviewTicket'}
    Artifact:
      description: Registered artefact metadata, with actual hash/dimensions.
      content:
        application/json:
          schema: {$ref: './schema.json#/$defs/Artifact'}
    Media:
      description: Immutable complete or ranged media bytes.
      headers:
        ETag: {schema: {type: string}}
        Accept-Ranges: {schema: {type: string, const: bytes}}
        Content-Length: {schema: {type: integer, minimum: 0}}
        Content-Range: {schema: {type: string}}
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    MediaHead:
      description: Same media/range headers as GET, without a response body.
      headers:
        ETag: {schema: {type: string}}
